<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1024" height="1024" viewBox="0 0 1024 1024"
     role="img" aria-labelledby="spotq-title spotq-description">
  <title id="spotq-title">SpotQ</title>
  <desc id="spotq-description">A white location pin with fork and spoon on an emerald green rounded-square background.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18C879"/>
      <stop offset="0.52" stop-color="#078B55"/>
      <stop offset="1" stop-color="#04523F"/>
    </linearGradient>
    <linearGradient id="pinFill" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAFBF2"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect x="24" y="24" width="976" height="976" rx="214"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <rect width="1024" height="1024" fill="url(#background)"/>
    <path d="M24 590V238C24 120 120 24 238 24h548C555 85 386 229 286 407 205 550 116 622 24 658Z"
          fill="#FFFFFF" opacity=".055"/>
    <path d="M1024 676c-142 58-210 184-322 348h322Z" fill="#003F32" opacity=".13"/>

    <!-- Main location-pin silhouette -->
    <path d="M512 112c-190.5 0-345 154.5-345 345 0 104.4 43.5 184.2 113.2 268.7L512 1000l231.8-274.3C813.5 641.2 857 561.4 857 457c0-190.5-154.5-345-345-345Z"
          fill="url(#pinFill)"/>

    <!-- Circular field and utensils -->
    <circle cx="512" cy="451" r="238" fill="#087D50"/>

    <!-- Fork -->
    <g fill="#FFFFFF">
      <rect x="355" y="300" width="28" height="166" rx="14"/>
      <rect x="402" y="286" width="28" height="180" rx="14"/>
      <rect x="449" y="300" width="28" height="166" rx="14"/>
      <path d="M355 447h122v32c0 48-25 84-61 104v151c0 25-14 40-34 40s-34-15-34-40V583c-36-20-61-56-61-104v-32Z"
            transform="translate(34 0)"/>
    </g>

    <!-- Spoon -->
    <g fill="#FFFFFF">
      <path d="M625 286c-57 0-96 57-96 125 0 52 22 91 55 118 12 10 17 24 17 42v163c0 27 15 43 37 43s37-16 37-43V571c0-18 5-32 17-42 33-27 55-66 55-118 0-68-39-125-96-125-9 0-18 2-26 5Z"/>
    </g>
  </g>
</svg>
