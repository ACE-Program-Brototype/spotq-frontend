
name: Frontend Deployment

on:
  push:
    branches:
      - main
      # REMOVE AFTER TESTING
      - development
      - fix/the-complete-UI-bug-fix

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout frontend source code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Configure Node.js and enable pnpm
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      # 3. Install dependencies using the lockfile
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 4. Install Infisical CLI
      - name: Install Infisical CLI
        run: |
          curl -1sLf \
            'https://artifacts-cli.infisical.com/setup.deb.sh' \
            | sudo -E bash
          sudo apt-get install -y infisical

      # 5. Build and deploy frontend
      - name: Build and deploy
        env:
          # Infisical Machine Identity credentials
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}

          # Cloudflare credentials
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

        run: |
          # Select Infisical environment based on Git branch
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            INFISICAL_ENV="prod"
          else
            INFISICAL_ENV="dev"
          fi

          # Build frontend with Infisical environment variables
          infisical run \
            --projectId="$INFISICAL_PROJECT_ID" \
            --env="$INFISICAL_ENV" \
            -- pnpm build

          # Deploy to Cloudflare Pages
          # Main branch = Production
          # Other branches = Preview
          npx wrangler pages deploy dist \
            --project-name=spotq-frontend \
            --branch="$GITHUB_REF_NAME"
